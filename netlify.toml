# Pin the build Node version: without this Netlify falls back to an ancient
# default (Node 8) and native deps like canvas fail to install.
# NOTE: the functions runtime (AWS_LAMBDA_JS_RUNTIME) can NOT be set here —
# Netlify only honors it from UI/CLI/API env vars. It must stay at nodejs22.x
# or newer because jsdom's dependency tree contains ESM-only files that old
# runtimes cannot require() (ERR_REQUIRE_ESM).
[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
