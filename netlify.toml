# Pin the build Node version: without this Netlify falls back to an ancient
# default (Node 8) and native deps like canvas fail to install.
# AWS_LAMBDA_JS_RUNTIME pins the *functions* runtime: this site predates
# Netlify's Node 22 default, so functions were still running an old Lambda
# Node that cannot require() ES modules (ERR_REQUIRE_ESM from jsdom's deps).
[build.environment]
  NODE_VERSION = "22"
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"

[functions]
  directory = "netlify/functions"
