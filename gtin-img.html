<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GTIN Barcode</title>
<style>
  html,body { margin: 0; padding: 0; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #fff; }
  canvas { max-width: 100%; height: auto; }
</style>
<canvas id="barcode"></canvas>
<script src="/JsBarcode.all.min.js"></script>
<script>
  var prefix = location.origin + "/gtin/img/";
  var code = location.href.startsWith(prefix) ? location.href.substring(prefix.length) : "";
  code = decodeURIComponent(code).replace(/\s+/g, "");
  if (code) {
    var format = code.length >= 14 ? "ITF14" : "EAN13";
    try {
      JsBarcode("#barcode", code, { format: format, width: 3, height: 120, fontSize: 20, margin: 10, textMargin: 6 });
    } catch (e) {
      document.body.innerHTML = "<p>Invalid code</p>";
    }
  }
</script>
