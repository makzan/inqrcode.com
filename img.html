<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>QR Code</title>
<style>
  html,body { margin: 0; padding: 0; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #fff; }
  img { max-width: 100%; height: auto; }
</style>
<div id="qrcode"></div>
<script src="/qrcode.min.js"></script>
<script>
  var prefix = location.origin + "/img/";
  var url = location.href.startsWith(prefix) ? location.href.substring(prefix.length) : "";
  var qrcode = new QRCode("qrcode", { width: 512, height: 512, correctLevel: QRCode.CorrectLevel.M });
  qrcode.makeCode(url);
</script>
